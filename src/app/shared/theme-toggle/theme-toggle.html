<button class="theme-toggle" type="button" (click)="toggle()" [attr.aria-label]="isDark() ? 'Use light theme' : 'Use dark theme'">
	<span class="theme-icon" aria-hidden="true">{{ isDark() ? '&#9788;' : '&#9790;' }}</span>
	<span class="theme-label">{{ isDark() ? 'Light' : 'Dark' }}</span>
</button>
